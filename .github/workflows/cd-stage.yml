name: CD - Deploy to Stage

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (commit SHA) to deploy'
        required: true
        type: string

env:
  EC2_HOST: 34.238.235.55
  EC2_USER: ubuntu
  NAMESPACE: stage

jobs:
  push-images:
    name: Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/chat-backend:stage-${{ inputs.image_tag }} simpleChatserver/
          docker push ghcr.io/${{ github.repository_owner }}/chat-backend:stage-${{ inputs.image_tag }}

      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/chat-frontend:stage-${{ inputs.image_tag }} simpleChatui/
          docker push ghcr.io/${{ github.repository_owner }}/chat-frontend:stage-${{ inputs.image_tag }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: push-images
    environment: stage
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

            cd /tmp
            git clone --branch stage https://github.com/${{ github.repository }}/Capstan-Project.git capstan-stage
            cd capstan-stage

            sed "s|IMAGE_PLACEHOLDER_BACKEND|ghcr.io/${{ github.repository_owner }}/chat-backend:stage-${{ inputs.image_tag }}|g" k8s/stage/backend.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -
            sed "s|IMAGE_PLACEHOLDER_FRONTEND|ghcr.io/${{ github.repository_owner }}/chat-frontend:stage-${{ inputs.image_tag }}|g" k8s/stage/frontend.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -

            kubectl rollout status deployment/chat-backend -n ${{ env.NAMESPACE }} --timeout=120s
            kubectl rollout status deployment/chat-frontend -n ${{ env.NAMESPACE }} --timeout=120s

            rm -rf /tmp/capstan-stage

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl get pods -n ${{ env.NAMESPACE }}
            kubectl get svc -n ${{ env.NAMESPACE }}
