name: Dev CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]
    paths-ignore:
      - 'k8s/**'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Short SHA
        id: vars
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build & Push Frontend (Dev)
        run: |
          cd simpleChatui
          docker build -f Dockerfile.dev -t ${{ secrets.DOCKER_USERNAME }}/simplechat-ui:dev-${{ env.SHA }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/simplechat-ui:dev-${{ env.SHA }}

      - name: Build & Push Backend (Dev)
        run: |
          cd simpleChatserver
          docker build -f Dockerfile.dev -t ${{ secrets.DOCKER_USERNAME }}/simplechat-server:dev-${{ env.SHA }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/simplechat-server:dev-${{ env.SHA }}

      - name: Update Kubernetes Manifests
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/simplechat-ui:dev-${{ env.SHA }}|g" k8s/dev/frontend.yaml
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/simplechat-server:dev-${{ env.SHA }}|g" k8s/dev/backend.yaml

      - name: Commit and Push Changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s/dev/*.yaml
          git commit -m "Update dev images to dev-${{ env.SHA }}"
          git push origin dev


- name: Commit and Push Changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s/dev/*.yaml
          git commit -m "Update dev images to dev-${{ env.SHA }}"
          git push origin dev
