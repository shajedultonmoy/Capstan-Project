name: CD - Deploy to Prod

on:
  pull_request:
    types: [closed]
    branches: [prod]

env:
  EC2_HOST: 34.238.235.55
  EC2_USER: ubuntu
  NAMESPACE: prod

jobs:
  push-images:
    name: Push Docker Images
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod

      - name: Get commit SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/chat-backend:prod-${{ steps.sha.outputs.SHORT_SHA }} simpleChatserver/
          docker push ghcr.io/${{ github.repository_owner }}/chat-backend:prod-${{ steps.sha.outputs.SHORT_SHA }}

      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/chat-frontend:prod-${{ steps.sha.outputs.SHORT_SHA }} simpleChatui/
          docker push ghcr.io/${{ github.repository_owner }}/chat-frontend:prod-${{ steps.sha.outputs.SHORT_SHA }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: push-images
    if: github.event.pull_request.merged == true
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod

      - name: Get commit SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

            cd /tmp
            git clone --branch prod https://github.com/${{ github.repository }}/Capstan-Project.git capstan-prod
            cd capstan-prod

            sed "s|IMAGE_PLACEHOLDER_BACKEND|ghcr.io/${{ github.repository_owner }}/chat-backend:prod-${{ steps.sha.outputs.SHORT_SHA }}|g" k8s/prod/backend.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -
            sed "s|IMAGE_PLACEHOLDER_FRONTEND|ghcr.io/${{ github.repository_owner }}/chat-frontend:prod-${{ steps.sha.outputs.SHORT_SHA }}|g" k8s/prod/frontend.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -

            kubectl rollout status deployment/chat-backend -n ${{ env.NAMESPACE }} --timeout=180s
            kubectl rollout status deployment/chat-frontend -n ${{ env.NAMESPACE }} --timeout=180s

            rm -rf /tmp/capstan-prod

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl get pods -n ${{ env.NAMESPACE }}
            kubectl get svc -n ${{ env.NAMESPACE }}
