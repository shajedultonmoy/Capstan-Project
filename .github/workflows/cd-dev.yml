name: CD - Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (commit SHA) to deploy'
        required: true
        type: string

env:
  EC2_HOST: 34.238.235.55
  EC2_USER: ubuntu
  NAMESPACE: dev

jobs:
  push-images:
    name: Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/chat-backend:dev-${{ inputs.image_tag }} simpleChatserver/
          docker push ghcr.io/${{ github.repository_owner }}/chat-backend:dev-${{ inputs.image_tag }}

      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/chat-frontend:dev-${{ inputs.image_tag }} simpleChatui/
          docker push ghcr.io/${{ github.repository_owner }}/chat-frontend:dev-${{ inputs.image_tag }}

  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: push-images
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

            # Pull and apply manifests with image tags
            cd /tmp
            git clone --branch dev https://github.com/${{ github.repository }}/Capstan-Project.git capstan-dev
            cd capstan-dev

            # Replace image placeholders and apply
            sed "s|IMAGE_PLACEHOLDER_BACKEND|ghcr.io/${{ github.repository_owner }}/chat-backend:dev-${{ inputs.image_tag }}|g" k8s/dev/backend.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -
            sed "s|IMAGE_PLACEHOLDER_FRONTEND|ghcr.io/${{ github.repository_owner }}/chat-frontend:dev-${{ inputs.image_tag }}|g" k8s/dev/frontend.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -

            kubectl rollout status deployment/chat-backend -n ${{ env.NAMESPACE }} --timeout=120s
            kubectl rollout status deployment/chat-frontend -n ${{ env.NAMESPACE }} --timeout=120s

            rm -rf /tmp/capstan-dev

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl get pods -n ${{ env.NAMESPACE }}
            kubectl get svc -n ${{ env.NAMESPACE }}
