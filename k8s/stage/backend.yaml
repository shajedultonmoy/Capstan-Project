# Staging Environment - Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  labels:
    app: chat-backend
    environment: stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-backend
      environment: stage
  template:
    metadata:
      labels:
        app: chat-backend
        environment: stage
    spec:
      containers:
        - name: backend
          image: IMAGE_PLACEHOLDER_BACKEND
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: CLIENT_URL
              value: "http://localhost:5173"
            - name: CHAT_PRIMARY_COLOR
              value: "#2563EB"
            - name: CHAT_SECONDARY_COLOR
              value: "#EFF6FF"
            - name: CHAT_USER_MESSAGE_COLOR
              value: "#2563EB"
            - name: CHAT_AGENT_MESSAGE_COLOR
              value: "#F3F4F6"
            - name: CHAT_TEXT_COLOR
              value: "#111827"
            - name: CHAT_BACKGROUND_COLOR
              value: "#FFFFFF"
            - name: CHAT_HEADER_COLOR
              value: "#2563EB"
            - name: CHAT_HEADER_TEXT_COLOR
              value: "#FFFFFF"
            - name: CHAT_INPUT_BACKGROUND_COLOR
              value: "#FFFFFF"
            - name: CHAT_BORDER_RADIUS
              value: "12px"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Staging Environment - Backend Service
apiVersion: v1
kind: Service
metadata:
  name: chat-backend
  labels:
    app: chat-backend
    environment: stage
spec:
  selector:
    app: chat-backend
    environment: stage
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
