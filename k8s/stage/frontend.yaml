# Staging Environment - Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-frontend
  labels:
    app: chat-frontend
    environment: stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-frontend
      environment: stage
  template:
    metadata:
      labels:
        app: chat-frontend
        environment: stage
    spec:
      containers:
        - name: frontend
          image: IMAGE_PLACEHOLDER_FRONTEND
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: "http://34.238.235.55:30083"
            - name: VITE_SOCKET_URL
              value: "http://34.238.235.55:30083"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Staging Environment - Frontend Service (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: chat-frontend
  labels:
    app: chat-frontend
    environment: stage
spec:
  selector:
    app: chat-frontend
    environment: stage
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30082
  type: NodePort
