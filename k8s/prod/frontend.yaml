# Production Environment - Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-frontend
  namespace: prod
  labels:
    app: chat-frontend
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chat-frontend
      environment: prod
  template:
    metadata:
      labels:
        app: chat-frontend
        environment: prod
    spec:
      containers:
        - name: frontend
          image: IMAGE_PLACEHOLDER_FRONTEND
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: "http://34.238.235.55:30085"
            - name: VITE_SOCKET_URL
              value: "http://34.238.235.55:30085"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Production Environment - Frontend Service (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: chat-frontend
  namespace: prod
  labels:
    app: chat-frontend
    environment: prod
spec:
  selector:
    app: chat-frontend
    environment: prod
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30084
  type: NodePort
