# Development Environment - Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-frontend
  namespace: dev
  labels:
    app: chat-frontend
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-frontend
      environment: dev
  template:
    metadata:
      labels:
        app: chat-frontend
        environment: dev
    spec:
      containers:
        - name: frontend
          image: shajedultonmoy/simplechat-ui:dev-9393466
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              value: "http://34.238.235.55:30081"
            - name: VITE_SOCKET_URL
              value: "http://34.238.235.55:30081"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
# Development Environment - Frontend Service (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: chat-frontend
  namespace: dev
  labels:
    app: chat-frontend
    environment: dev
spec:
  selector:
    app: chat-frontend
    environment: dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5173
      nodePort: 30080
  type: NodePort
