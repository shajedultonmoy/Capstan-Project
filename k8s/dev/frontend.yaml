# Development Environment - Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-frontend
  namespace: dev
  labels:
    app: chat-frontend
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-frontend
      environment: dev
  template:
    metadata:
      labels:
        app: chat-frontend
        environment: dev
    spec:
      containers:
        - name: frontend
          image: shajedultonmoy/simplechat-ui:dev-0c5f8b6
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: "http://34.238.235.55:30081"
            - name: VITE_SOCKET_URL
              value: "http://34.238.235.55:30081"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Development Environment - Frontend Service (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: chat-frontend
  namespace: dev
  labels:
    app: chat-frontend
    environment: dev
spec:
  selector:
    app: chat-frontend
    environment: dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
